name: BigData Data Cleaning Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  data-cleaning:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Create Database
        run: |
          cd src
          python laptop_prices.py

      - name: 🧹 Run data cleaning script
        run: |
          cd src
          python cleaning.py

      - name: 📊 Upload Cleaned data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-data-artifact
          path: src/static/xlsx/cleaned_data.xlsx
          retention-days: 30

      - name: 📋 Upload Audit Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-artifact
          path: src/static/auditoria/cleaning_report.txt
          retention-days: 30

      - name: ✅ Display Audit Report
        run: |
          echo "=== Audit Report ==="
          cat src/static/auditoria/cleaning_report.txt

      - name: 📤 Commit Results (if chasges)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/static/
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 Auto: Update cleaned data and audit report"
          git push
        continue-on-error: true
