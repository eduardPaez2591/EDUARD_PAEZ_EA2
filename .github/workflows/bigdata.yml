name: BigData Data Cleaning Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  data-cleaning:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Create Database
        run: |
          cd src
          python ingestion.py

      - name: 🧹 Run data cleaning script
        run: |
          cd src
          python cleaning.py

      - name: 📊 Upload Cleaned data Artifact
        uses: actions/upload-artifact@v6
        with:
          name: cleaned-data-artifact
          path: src/static/xlsx/cleaned_data.xlsx
          retention-days: 30

      - name: 📋 Upload Audit Report Artifact
        uses: actions/upload-artifact@v6
        with:
          name: audit-report-artifact
          path: src/static/auditoria/cleaning_report.txt
          retention-days: 30

      - name: ✅ Display Audit Report
        run: |
          echo "=== Audit Report ==="
          cat src/static/auditoria/cleaning_report.txt
